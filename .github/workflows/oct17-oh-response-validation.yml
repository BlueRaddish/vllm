name: SDK truncated response validation (scratch)
on:
  push:
    branches: [ci/oct17-ao-oh-response-errors-v4]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: ${{ github.sha }}
          path: runner-control
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.13'
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24'
      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78
        with:
          version: '0.12.23'
          enable-cache: false
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          repository: OpenHands/software-agent-sdk
          ref: 1fbfd37f6fb21491ed733fc92d409aff1517ff4a
          path: source
          persist-credentials: false
      - name: Verify actual truncated responses, controls and normal hooks
        working-directory: source
        run: python ../runner-control/validation/validation.py
