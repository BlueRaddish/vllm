name: Frozen Oct13 evening cmux deadline verification

on:
  push:
    branches:
      - codex-validation/oct13-evening-cmux-precheck-*

permissions:
  contents: read

jobs:
  cmux-native-producer:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          persist-credentials: false
      - run: python3 validation/producer.py cmux produce
