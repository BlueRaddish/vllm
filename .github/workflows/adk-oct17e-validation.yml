name: ADK7045 Independent Cleanup Review Validation (scratch)

on:
  push:
    branches: [ci/oct17e-ao-adk7045-review-v2]

permissions:
  contents: read

jobs:
  rebase-and-test:
    name: cleanup-${{ matrix.python.lane }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        python:
          - version: '3.13'
            lane: py313
    env:
      PYTHON_VERSION: ${{ matrix.python.version }}
      TOX_LANE: ${{ matrix.python.lane }}
      UV_EXCLUDE_NEWER: '2026-10-18T02:13:52Z'
    steps:
      - name: Check out validation control only
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          ref: ${{ github.sha }}
          path: runner-control
          persist-credentials: false
      - name: Install the lane interpreter
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: ${{ matrix.python.version }}
      - name: Install standalone uv
        uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7
        with:
          version: '0.12.23'
          enable-cache: false
      - name: Check out the verified upstream rebase parent
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          repository: google/adk-python
          ref: 93b70886c373f4a6f4718596b4a7f38aacd464bd
          fetch-depth: 1
          path: source
          persist-credentials: false
      - name: Fetch the exact independent comparison baseline
        working-directory: source
        run: git fetch --no-tags --depth=1 origin b0180620f4c2f4f4467a89c37a30f75bf849700b
      - name: Apply reviewed patch, prove regression, run relevant owners and scoped hooks
        working-directory: source
        run: python ../runner-control/scripts/_adk_oct17e_validation.py prepare
      - name: Print final source, config, lock and native commit proof
        if: always()
        working-directory: source
        run: python ../runner-control/scripts/_adk_oct17e_validation.py after
