name: Oct17 cmux integration preview verification
on:
  push:
    branches: [codex-validation/oct17-cmux-preview-20261017]
permissions:
  contents: read
jobs:
  preview:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Verify frozen existing integration preview
        run: python3 validation/producer.py
      - name: Keep proof through cleanup
        if: always()
        run: |
          python3 - <<'PY'
          from pathlib import Path
          root=Path('/tmp/oct17-vc-cmux-preview-proofs')
          receipt=root/'receipt.json'
          if receipt.exists():
              print('OCT17_VC_FINAL_RECEIPT='+receipt.read_text().replace('\n',''))
          PY
