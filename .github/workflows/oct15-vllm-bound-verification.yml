name: Frozen Oct15 vLLM bound-keyword verification
on:
  push:
    branches: ['codex-validation/oct15-vllm-bound-precheck-*']
permissions:
  contents: read
jobs:
  vllm-precheck:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          persist-credentials: false
      - run: python3 validation/producer.py vllm precheck
  vllm-personal:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          persist-credentials: false
      - run: python3 validation/producer.py vllm personal
