name: Independent ADK empty-file review (scratch)
on:
  push:
    branches: [ci/oct18e-ao-adk7585-review-v2]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    env:
      UV_EXCLUDE_NEWER: '2026-10-17T08:00:00Z'
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
        with:
          path: runner-control
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.14'
      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78
        with:
          version: '0.12.23'
          enable-cache: false
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
        with:
          repository: google/adk-python
          ref: 638d932a9e339d8d968d1f48456ce4afbc973698
          fetch-depth: 2
          path: source
          persist-credentials: false
      - name: Actual regression, range controls, owning suites and ordinary scoped hooks
        working-directory: source
        run: python ../runner-control/validation/review.py
